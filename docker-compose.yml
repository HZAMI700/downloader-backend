version: '3.8'

services:
  downloader-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-downloader-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - ALLOWED_ORIGINS=*
      - MAX_DOWNLOAD_TIME_MS=600000
      - CLEANUP_INTERVAL_MS=900000
      - FILE_EXPIRATION_MS=1800000
    volumes:
      - ./temp:/app/temp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
